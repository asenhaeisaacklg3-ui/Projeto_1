<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <style>
    
    body {
    
      background-image: url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSQWRx14TUqfq4mGNf3YHvtg7R_naWNJ9-dNpG210Tj3DeHr4g4AmEMm98&s=10);
      
      
      background-size: 100% 100%
      ;
      
      
      background-position: center;
      
      
      background-repeat: no-repeat;
      
      
      background-attachment: fixed;

    ;

     
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
    }

    
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      background-color: rgba(255, 255, 255, 0.85); 
      padding: 25px 40px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    
    .label-texto {
      font-size: 16px;
      font-weight: bold;
      color: #333;
      margin-top: 8px;
    }

    
    .switch {
      position: relative;
      display: inline-block;
      width: 60px;
      height: 34px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 34px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 26px;
      width: 26px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }

    
    input:checked + .slider {
      background-color: #135336;
    }

    input:checked + .slider:before {
      transform: translateX(26px);
    }
  </style>
</head>
<body>

  <div class="container">
    
    <h1>MOD MENU DO GULOSÃO</h1>
    
    
    <span class="label-texto">NOTAS MÁXIMAS</span>
    <label class="switch">
      <input type="checkbox">
      <span class="slider"></span>
    </label>

    
    <span class="label-texto">PÉ DE MEIA INFINITO</span>
    <label class="switch">
      <input type="checkbox">
      <span class="slider"></span>
    </label>

    
    <span class="label-texto">PODER FALTAR NO CONTRA-TURNO</span>
    <label class="switch">
      <input type="checkbox">
      <span class="slider"></span>
    </label>

  </div>

</body>
</html>
